<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go Playground</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="titlebar">
  <div class="brand"><img src="/logo.svg" alt="" width="26" height="26"><span>Go Playground</span></div>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div class="actions">
    <button class="icon-btn" data-action="palette" data-sc="palette" data-icon="search" aria-label="Search"></button>
    <button class="icon-btn" data-action="help" data-sc="help" data-icon="keyboard" aria-label="Shortcuts"></button>
  </div>
</header>

<div class="dock dock-left"></div>
<div class="dock dock-right"></div>

<main>
  <section class="view" data-view="playground">
    <div class="panel" data-panel="editor" data-title="Editor">
      <div class="panel-head">
        <h2 data-icon="editor">Editor</h2>
        <div class="toolbar">
          <button class="btn primary" data-action="run" data-sc="run" data-icon="play">Run</button>
          <button class="btn" data-action="format" data-sc="format" data-icon="format">Format</button>
        </div>
      </div>
      <div id="editor" class="editor"></div>
    </div>
    <div class="panel" data-panel="output" data-title="Output">
      <div class="panel-head">
        <h2 data-icon="terminal">Output</h2>
        <div class="toolbar">
          <span id="run-status" class="status">idle</span>
          <button class="btn" data-action="clear" data-sc="clear" data-icon="trash">Clear</button>
        </div>
      </div>
      <div id="output" class="output"></div>
    </div>
  </section>

  <section class="view" data-view="docs" hidden>
    <div class="panel narrow" data-panel="doc-nav" data-title="Topics">
      <div class="panel-head"><h2 data-icon="book">Topics</h2></div>
      <ul id="doc-list" class="list"></ul>
    </div>
    <div class="panel" data-panel="doc-content" data-title="Article">
      <div class="panel-head"><h2 id="doc-title">Docs</h2></div>
      <article id="doc-body" class="prose"></article>
    </div>
  </section>

  <section class="view" data-view="samples" hidden>
    <div class="panel narrow" data-panel="sample-nav" data-title="Samples">
      <div class="panel-head"><h2 data-icon="code">Samples</h2></div>
      <ul id="sample-list" class="list"></ul>
    </div>
    <div class="panel" data-panel="sample-view" data-title="Sample code">
      <div class="panel-head">
        <h2 id="sample-title">Sample</h2>
        <div class="toolbar">
          <button id="sample-open" class="btn" data-icon="editor" data-tip="Open in Playground">Open</button>
          <button id="sample-run" class="btn primary" data-icon="play" data-tip="Open and run">Run</button>
        </div>
      </div>
      <div id="sample-code" class="readonly-code"></div>
    </div>
  </section>
</main>

<div id="palette" class="modal" hidden>
  <div class="modal-card palette-card" role="dialog" aria-label="Search">
    <div class="search-row" data-icon="search"><input type="text" placeholder="Search tabs, docs, samples, actions..." aria-label="Search"></div>
    <ul class="results"></ul>
  </div>
</div>

<div id="help" class="modal" hidden>
  <div class="modal-card help-card" role="dialog" aria-label="Keyboard shortcuts">
    <div class="search-row" data-icon="keyboard"><input type="text" placeholder="Filter shortcuts..." aria-label="Filter shortcuts"><span class="count"></span></div>
    <div class="groups"></div>
  </div>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
