<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text{font-family:'Caveat',cursive;fill:#1e2235}</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4060"/></marker>
  </defs>
  <rect width="1400" height="880" fill="#fdfcf7"/>
  <text x="700" y="56" font-size="48" font-weight="700" text-anchor="middle">tchess architecture</text>

  <g filter="url(#wobble)" stroke="#3b4060" stroke-width="2.5">
    <rect x="60" y="100" width="320" height="110" rx="16" fill="#fff9c4"/>
    <rect x="540" y="100" width="320" height="110" rx="16" fill="#fff9c4"/>

    <rect x="40" y="280" width="1320" height="260" rx="18" fill="#e3f2fd"/>
    <rect x="70" y="340" width="290" height="170" rx="14" fill="#fce4ec"/>
    <rect x="390" y="340" width="290" height="170" rx="14" fill="#fff3e0"/>
    <rect x="710" y="340" width="290" height="170" rx="14" fill="#fff3e0"/>
    <rect x="1030" y="340" width="300" height="170" rx="14" fill="#e0f7fa"/>

    <rect x="40" y="630" width="400" height="200" rx="18" fill="#ede7f6"/>
    <rect x="560" y="630" width="460" height="200" rx="18" fill="#e8f5e9"/>
    <rect x="1080" y="630" width="280" height="200" rx="18" fill="#fbe9e7"/>
  </g>

  <g stroke="#3b4060" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M220 210 L220 336"/>
    <path d="M700 210 L700 276"/>
    <path d="M150 510 L150 626"/>
    <path d="M330 628 L330 514"/>
    <path d="M760 540 L760 626"/>
    <path d="M440 740 L556 740"/>
    <path d="M1220 540 L1220 626"/>
  </g>

  <text x="220" y="148" font-size="34" font-weight="700" text-anchor="middle">Terminal</text>
  <text x="220" y="184" font-size="25" text-anchor="middle">keys · mouse · resize · draw</text>
  <text x="700" y="148" font-size="34" font-weight="700" text-anchor="middle">main.go</text>
  <text x="700" y="184" font-size="25" text-anchor="middle">flags: -version · -capture DIR</text>

  <text x="1330" y="318" font-size="32" font-weight="700" text-anchor="end">internal/ui  (tcell)</text>
  <text x="215" y="380" font-size="30" font-weight="700" text-anchor="middle">App event loop</text>
  <text x="215" y="418" font-size="23" text-anchor="middle">PollEvent → Handle → Draw</text>
  <text x="215" y="450" font-size="23" text-anchor="middle">menu · game · help · promote</text>
  <text x="215" y="482" font-size="23" text-anchor="middle">generation guards stale AI</text>
  <text x="535" y="380" font-size="30" font-weight="700" text-anchor="middle">layout + board</text>
  <text x="535" y="418" font-size="23" text-anchor="middle">7x3 sprites or 3x1 glyphs</text>
  <text x="535" y="450" font-size="23" text-anchor="middle">cursor · targets · check</text>
  <text x="535" y="482" font-size="23" text-anchor="middle">click → squareAt</text>
  <text x="855" y="380" font-size="30" font-weight="700" text-anchor="middle">panel + overlays</text>
  <text x="855" y="418" font-size="23" text-anchor="middle">players · status · captured</text>
  <text x="855" y="450" font-size="23" text-anchor="middle">SAN move list</text>
  <text x="855" y="482" font-size="23" text-anchor="middle">result · promotion · keys</text>
  <text x="1180" y="380" font-size="30" font-weight="700" text-anchor="middle">capture</text>
  <text x="1180" y="418" font-size="23" text-anchor="middle">SimulationScreen cells</text>
  <text x="1180" y="450" font-size="23" text-anchor="middle">→ HTML → Playwright</text>
  <text x="1180" y="482" font-size="23" text-anchor="middle">→ printscreens/*.png</text>

  <text x="162" y="575" font-size="24">goroutine</text>
  <text x="162" y="602" font-size="24">Best(pos, depth)</text>
  <text x="342" y="575" font-size="24">EventInterrupt</text>
  <text x="342" y="602" font-size="24">with the move</text>
  <text x="772" y="590" font-size="24">Play · MovesFrom · Status · Undo</text>
  <text x="1232" y="590" font-size="24">palette</text>
  <text x="498" y="728" font-size="21" text-anchor="middle">Legal</text>
  <text x="498" y="768" font-size="21" text-anchor="middle">Moves</text>

  <text x="240" y="676" font-size="32" font-weight="700" text-anchor="middle">internal/engine</text>
  <text x="240" y="714" font-size="23" text-anchor="middle">negamax + alpha-beta</text>
  <text x="240" y="746" font-size="23" text-anchor="middle">quiescence on captures</text>
  <text x="240" y="778" font-size="23" text-anchor="middle">material + piece-square eval</text>
  <text x="240" y="810" font-size="23" text-anchor="middle">Easy 1 · Medium 3 · Hard 4 ply</text>
  <text x="790" y="676" font-size="32" font-weight="700" text-anchor="middle">internal/chess</text>
  <text x="790" y="714" font-size="23" text-anchor="middle">Position: [64]Piece value type, Play copies</text>
  <text x="790" y="746" font-size="23" text-anchor="middle">legal movegen · castling · en passant</text>
  <text x="790" y="778" font-size="23" text-anchor="middle">FEN · SAN · Game history + undo</text>
  <text x="790" y="810" font-size="23" text-anchor="middle">mate · stalemate · 50-move · 3-fold · material</text>
  <text x="1220" y="676" font-size="32" font-weight="700" text-anchor="middle">internal/theme</text>
  <text x="1220" y="714" font-size="23" text-anchor="middle">neon palette</text>
  <text x="1220" y="746" font-size="23" text-anchor="middle">board squares</text>
  <text x="1220" y="778" font-size="23" text-anchor="middle">Mix for highlights</text>
</svg>
