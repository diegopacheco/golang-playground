<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text{font-family:'Caveat',cursive;fill:#1e2235}</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4060"/></marker>
  </defs>
  <rect width="1400" height="900" fill="#fdfcf7"/>
  <text x="700" y="56" font-size="48" font-weight="700" text-anchor="middle">pgo-fun architecture</text>

  <g filter="url(#wobble)" stroke="#3b4060" stroke-width="2.5">
    <rect x="60" y="100" width="340" height="130" rx="16" fill="#fff9c4"/>
    <rect x="530" y="100" width="340" height="130" rx="16" fill="#fff9c4"/>
    <rect x="1000" y="100" width="340" height="130" rx="16" fill="#fff9c4"/>

    <rect x="40" y="300" width="900" height="300" rx="18" fill="#e3f2fd"/>
    <rect x="70" y="360" width="260" height="210" rx="14" fill="#fce4ec"/>
    <rect x="360" y="360" width="270" height="210" rx="14" fill="#fff3e0"/>
    <rect x="660" y="360" width="250" height="210" rx="14" fill="#e0f7fa"/>

    <rect x="1000" y="300" width="340" height="300" rx="18" fill="#ede7f6"/>

    <rect x="40" y="680" width="420" height="180" rx="18" fill="#e8f5e9"/>
    <rect x="530" y="680" width="380" height="180" rx="18" fill="#fbe9e7"/>
    <rect x="980" y="680" width="380" height="180" rx="18" fill="#e8f5e9"/>
  </g>

  <g stroke="#3b4060" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M230 230 L230 356"/>
    <path d="M700 230 L700 296"/>
    <path d="M1170 230 L1170 296"/>
    <path d="M996 420 L944 420"/>
    <path d="M944 500 L996 500"/>
    <path d="M1170 600 L1170 676"/>
    <path d="M1130 600 L780 676"/>
    <path d="M526 770 L464 770"/>
    <path d="M250 676 L250 604"/>
  </g>

  <text x="230" y="150" font-size="34" font-weight="700" text-anchor="middle">cmd/service</text>
  <text x="230" y="186" font-size="25" text-anchor="middle">Config · logx · graceful stop</text>
  <text x="230" y="214" font-size="25" text-anchor="middle">port 8082</text>
  <text x="700" y="150" font-size="34" font-weight="700" text-anchor="middle">scripts/pgo.sh</text>
  <text x="700" y="186" font-size="25" text-anchor="middle">build · profile · rebuild</text>
  <text x="700" y="214" font-size="25" text-anchor="middle">alternate off / pgo rounds</text>
  <text x="1170" y="150" font-size="34" font-weight="700" text-anchor="middle">cmd/loadgen</text>
  <text x="1170" y="186" font-size="25" text-anchor="middle">-c workers · -duration</text>
  <text x="1170" y="214" font-size="25" text-anchor="middle">-profile · -out results.tsv</text>

  <text x="920" y="338" font-size="32" font-weight="700" text-anchor="end">HTTP service (net/http ServeMux)</text>
  <text x="200" y="400" font-size="30" font-weight="700" text-anchor="middle">logx middleware</text>
  <text x="200" y="440" font-size="23" text-anchor="middle">X-Correlation-Id</text>
  <text x="200" y="472" font-size="23" text-anchor="middle">keep or generate</text>
  <text x="200" y="504" font-size="23" text-anchor="middle">slog JSON logger</text>
  <text x="495" y="400" font-size="30" font-weight="700" text-anchor="middle">internal/api</text>
  <text x="495" y="440" font-size="23" text-anchor="middle">POST /orders</text>
  <text x="495" y="472" font-size="23" text-anchor="middle">GET /orders/{id}</text>
  <text x="495" y="504" font-size="23" text-anchor="middle">POST /orders/summary</text>
  <text x="495" y="536" font-size="23" text-anchor="middle">GET /debug/pprof/profile</text>
  <text x="785" y="400" font-size="30" font-weight="700" text-anchor="middle">internal/order</text>
  <text x="785" y="440" font-size="23" text-anchor="middle">Price: tax, coupons</text>
  <text x="785" y="472" font-size="23" text-anchor="middle">Summarize per customer</text>
  <text x="785" y="504" font-size="23" text-anchor="middle">internal/store (RWMutex)</text>

  <text x="1170" y="350" font-size="30" font-weight="700" text-anchor="middle">internal/loadgen</text>
  <text x="1170" y="388" font-size="23" text-anchor="middle">seeded JSON workload</text>
  <text x="970" y="410" font-size="21" text-anchor="middle">req</text>
  <text x="970" y="530" font-size="21" text-anchor="middle">resp</text>
  <text x="1170" y="428" font-size="23" text-anchor="middle">warmup, then measure</text>
  <text x="1170" y="468" font-size="23" text-anchor="middle">req/s · p50 · p99</text>
  <text x="1170" y="508" font-size="23" text-anchor="middle">internal/profile capture</text>

  <text x="250" y="728" font-size="32" font-weight="700" text-anchor="middle">go build</text>
  <text x="250" y="770" font-size="24" text-anchor="middle">-pgo=off  → bin/service-off</text>
  <text x="250" y="806" font-size="24" text-anchor="middle">-pgo=auto → bin/service-pgo</text>
  <text x="720" y="728" font-size="32" font-weight="700" text-anchor="middle">cmd/service/default.pgo</text>
  <text x="720" y="770" font-size="24" text-anchor="middle">30s CPU profile under load</text>
  <text x="720" y="806" font-size="24" text-anchor="middle">hot calls get inlined</text>
  <text x="1170" y="728" font-size="32" font-weight="700" text-anchor="middle">cmd/report</text>
  <text x="1170" y="770" font-size="24" text-anchor="middle">median per build</text>
  <text x="1170" y="806" font-size="24" text-anchor="middle">before / after delta table</text>
</svg>
