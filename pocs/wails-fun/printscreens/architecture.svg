<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700');
      text { font-family: 'Caveat', 'Comic Sans MS', cursive; fill: #1d2433; }
      .t { font-size: 26px; font-weight: 700; }
      .s { font-size: 19px; }
      .box { stroke: #1d2433; stroke-width: 2.2; filter: url(#wobble); }
      .arrow { stroke: #1d2433; stroke-width: 2.2; fill: none; filter: url(#wobble); marker-end: url(#head); }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#1d2433" stroke-width="2"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <rect class="box" x="30" y="40" width="250" height="110" rx="14" fill="#dbe4ff"/>
  <text class="t" x="155" y="85" text-anchor="middle">Wails window</text>
  <text class="s" x="155" y="115" text-anchor="middle">native WebView, HTML/JS UI</text>

  <rect class="box" x="30" y="220" width="250" height="110" rx="14" fill="#fff3bf"/>
  <text class="t" x="155" y="265" text-anchor="middle">REST clients</text>
  <text class="s" x="155" y="295" text-anchor="middle">browser, scripts, curl :8090</text>

  <rect class="box" x="360" y="120" width="250" height="130" rx="14" fill="#d3f9d8"/>
  <text class="t" x="485" y="165" text-anchor="middle">httpapi router</text>
  <text class="s" x="485" y="195" text-anchor="middle">logx middleware, handlers</text>
  <text class="s" x="485" y="222" text-anchor="middle">one error to status mapper</text>

  <rect class="box" x="690" y="30" width="240" height="90" rx="14" fill="#ffe3e3"/>
  <text class="t" x="810" y="70" text-anchor="middle">services</text>
  <text class="s" x="810" y="98" text-anchor="middle">employee sale receipt invoice</text>

  <rect class="box" x="690" y="200" width="240" height="90" rx="14" fill="#f3d9fa"/>
  <text class="t" x="810" y="240" text-anchor="middle">SQL stores</text>
  <text class="s" x="810" y="268" text-anchor="middle">database/sql repositories</text>

  <rect class="box" x="690" y="380" width="240" height="100" rx="14" fill="#e7f5ff"/>
  <text class="t" x="810" y="425" text-anchor="middle">SQLite biz.db</text>
  <text class="s" x="810" y="455" text-anchor="middle">modernc.org/sqlite, pure Go</text>

  <rect class="box dash" x="360" y="380" width="250" height="100" rx="14" fill="#f8f9fa"/>
  <text class="t" x="485" y="425" text-anchor="middle">embedded assets</text>
  <text class="s" x="485" y="455" text-anchor="middle">frontend/dist via go:embed</text>

  <path class="arrow" d="M280,95 C320,100 330,150 358,165"/>
  <text class="s" x="155" y="185" text-anchor="middle">calls via AssetServer.Handler</text>
  <path class="arrow" d="M280,275 C320,270 330,230 358,215"/>
  <text class="s" x="155" y="365" text-anchor="middle">calls via net/http :8090</text>
  <path class="arrow" d="M610,160 C650,140 660,90 688,80"/>
  <path class="arrow" d="M810,122 C822,150 798,170 811,198"/>
  <path class="arrow" d="M810,292 C822,320 798,350 811,378"/>
  <path class="arrow dash" d="M485,378 C497,330 473,290 486,252"/>
  <text class="s" x="500" y="320">serves UI files</text>
</svg>
